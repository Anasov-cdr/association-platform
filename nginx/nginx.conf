# ── Upstream ─────────────────────────────────────────────────────────────────
upstream backend {
    server backend:4000;
}

upstream frontend {
    server frontend:80;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name bfetassociation.kg www.bfetassociation.kg;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main ───────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name bfetassociation.kg www.bfetassociation.kg;

    ssl_certificate     /etc/letsencrypt/live/bfetassociation.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bfetassociation.kg/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 50M;

    # ── API routes → backend ──────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Socket.io (WebSocket) → backend ──────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Uploaded files → backend ──────────────────────────────────────────
    location /uploads/ {
        proxy_pass       http://backend;
        proxy_set_header Host $host;
        expires          30d;
        add_header       Cache-Control "public, immutable";
    }

    # ── Frontend (React SPA) ──────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
